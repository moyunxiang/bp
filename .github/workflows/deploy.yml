name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每天北京时间06:30刷新一次王者营地英雄榜并重新发布
  schedule:
    - cron: '30 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 数据包已随仓库提交。定时或手动运行时只刷新王者营地英雄榜（18次请求）；失败就沿用仓库里的数据
      - if: github.event_name != 'push'
        continue-on-error: true
        run: npx tsx scripts/fetch-camp.ts && npx tsx scripts/build-data.ts --keep-date
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
